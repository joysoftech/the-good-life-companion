        autopsyReflection:

        cliffhangerTitle: 'EPILOGUE UNLOCKED • THE STRANGER BENEATH THE MONUMENT',

    // =========================================================================
    // PERSISTENT STATE MANAGEMENT
    // =========================================================================
    const STORAGE_KEY = 'the_good_life_episodic_v3';

    function createDefaultChapterState() {
      return {
        wisdom: 20,
        activeCaseIndex: 0,
        cases: [
          { heard: false, searched: false, selectedKey: null, confirmed: false, rulingCode: null, precedent: null, scores: null },
          { heard: false, searched: false, selectedKey: null, confirmed: false, rulingCode: null, precedent: null, scores: null },
          { heard: false, searched: false, selectedKey: null, confirmed: false, rulingCode: null, precedent: null, scores: null }
        ],
        mirrorChoice: null,
        mirrorNote: '',
        completed: false
      };
    }

    function createInitialState() {
      const chaptersMap = {};
      CHAPTERS.forEach((ch) => {
        chaptersMap[ch.num] = createDefaultChapterState();
      });
      return {
        playerName: '',
        mode: 'reader', // 'reader' | 'classroom'
        view: 'hub', // 'hub' | 'episode' | 'autopsy' | 'ledger'
        activeChapterNum: 1,
        projectorLarge: false,
        precedentRollOpen: true,
        pendingResetType: null,
        chapters: chaptersMap
      };
    }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        const base = createInitialState();
        base.playerName = typeof parsed.playerName === 'string' ? parsed.playerName : '';
        base.mode = parsed.mode === 'classroom' ? 'classroom' : 'reader';
        base.projectorLarge = Boolean(parsed.projectorLarge);
        if (parsed.chapters) {
          CHAPTERS.forEach((ch) => {
            if (parsed.chapters[ch.num]) {
              base.chapters[ch.num] = {
                ...createDefaultChapterState(),
                ...parsed.chapters[ch.num]
              };
            }
          });
        }
        return base;
      } catch (e) {
        return createInitialState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage errors
      }
    }

    // =========================================================================
    // HELPERS
    // =========================================================================
    function getDisplayName() {
      const trimmed = (state.playerName || '').trim();
      return trimmed.length > 0 ? trimmed : 'Reader';
    }

    function getChapter(num) {
      return CHAPTERS.find((c) => c.num === num) || CHAPTERS[0];
    }

    function getChapterProgress(num) {
      return state.chapters[num];
    }

    function isChapterUnlocked(num) {
      if (state.mode === 'classroom') return true;
      if (num === 1) return true;
      return Boolean(state.chapters[num - 1]?.completed);
    }

    function getCompletedChapterCount() {
      return CHAPTERS.filter((ch) => state.chapters[ch.num]?.completed).length;
    }

    function computeChapterPillarScores(ch, chProg) {
      let justiceRaw = 0;
      let mercyRaw = 0;
      let communityRaw = 0;
      let counted = 0;

      ch.cases.forEach((caseDef, idx) => {
        const cState = chProg.cases[idx];
        if (cState && cState.confirmed) {
          const s = cState.scores || getFallbackScores(caseDef, cState);
          justiceRaw += s.justice;
          mercyRaw += s.mercy;
          communityRaw += s.community;
          counted += 1;
        }
      });

      const maxPossible = Math.max(5, counted * 5);
      return {
        justice: Math.round((justiceRaw / maxPossible) * 100),
        mercy: Math.round((mercyRaw / maxPossible) * 100),
        community: Math.round((communityRaw / maxPossible) * 100),
        counted
      };
    }

    function getFallbackScores(caseDef, cState) {
      if (cState.rulingCode === 'A') return caseDef.rulings.A.scores;
      if (cState.rulingCode === 'B') return caseDef.rulings.B.scores;
      if (cState.heard && cState.searched) return caseDef.rulings.C_BOTH.scores;
      if (cState.heard) return caseDef.rulings.C_HEAR.scores;
      return caseDef.rulings.C_SEARCH.scores;
    }

    function computeCumulativePillarScores() {
      let jSum = 0;
      let mSum = 0;
      let cSum = 0;
      let completedChapters = 0;

      CHAPTERS.forEach((ch) => {
        const prog = state.chapters[ch.num];
        if (prog && prog.completed) {
          const sc = computeChapterPillarScores(ch, prog);
          jSum += sc.justice;
          mSum += sc.mercy;
          cSum += sc.community;
          completedChapters += 1;
        }
      });

      if (completedChapters === 0) return null;
      return {
        justice: Math.round(jSum / completedChapters),
        mercy: Math.round(mSum / completedChapters),
        community: Math.round(cSum / completedChapters),
        count: completedChapters
      };
    }

    function getPillarDiagnostic(scores) {
      const { justice, mercy, community } = scores;
      const minVal = Math.min(justice, mercy, community);
      const maxVal = Math.max(justice, mercy, community);

      if (maxVal >= 85 && minVal >= 80) {
        return 'Harmonized Moral Discernment — You balanced impartial justice, compassionate mercy, and communal trust without pitting them against each other.';
      }
      if (justice - mercy >= 20) {
        return 'Justice-Weighted Posture — Your rulings prioritized truth, rules, and accountability, though vulnerable individuals carried heavier immediate costs.';
      }
      if (mercy - justice >= 20) {
        return 'Mercy-Weighted Posture — Your rulings protected immediate human vulnerability with warmth, though structural accountability remained lighter.';
      }
      if (community - justice >= 15 || community - mercy >= 15) {
        return 'Community-Oriented Posture — You prioritized social cohesion and shared trust, seeking peace across competing groups.';
      }
      return 'Measured Ethical Balance — Your decisions navigated competing claims with thoughtful restraint across accountability, care, and shared life.';
    }

    function getActiveRulingC(caseDef, cState) {
      if (cState.heard && cState.searched) return caseDef.rulings.C_BOTH;
      if (cState.heard) return caseDef.rulings.C_HEAR;
      if (cState.searched) return caseDef.rulings.C_SEARCH;
      return null;
    }

    function getRulingObject(caseDef, cState, key) {
      if (key === 'A') return caseDef.rulings.A;
      if (key === 'B') return caseDef.rulings.B;
      if (key === 'C') return getActiveRulingC(caseDef, cState);
      return null;
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.add('hidden');
      }, 3000);
    }

    // =========================================================================
    // USER ACTIONS
    // =========================================================================
    function updatePlayerName(val) {
      state.playerName = val;
      saveState();
      const greetEl = document.getElementById('hubWelcomeGreeting');
      if (greetEl) {
        const name = getDisplayName();
        greetEl.textContent =
          name === 'Reader'
            ? 'Welcome, Reader — Read a Chapter, Then Enter the Dilemma'
            : `Welcome, ${name} — Read a Chapter, Then Enter the Dilemma`;
      }
    }

    function setMode(mode) {
      state.mode = mode;
      saveState();
      render();
    }

    function toggleProjectorScale() {
      state.projectorLarge = !state.projectorLarge;
      saveState();
      render();
    }

    function goToHub() {
      cancelResetPrompt();
      state.view = 'hub';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToLedger() {
      cancelResetPrompt();
      state.view = 'ledger';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openChapter(num) {
      if (!isChapterUnlocked(num)) return;
      cancelResetPrompt();
      state.activeChapterNum = num;
      const chProg = getChapterProgress(num);
      if (chProg.completed) {
        state.view = 'autopsy';
      } else {
        state.view = 'episode';
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function promptReset(type) {
      state.pendingResetType = type;
      const bar = document.getElementById('resetConfirmBar');
      const msg = document.getElementById('resetConfirmMsg');
      msg.textContent =
        type === 'all'
          ? 'Reset all 6 chapters and clear your saved rulings?'
          : `Reset Chapter ${state.activeChapterNum} back to 20T and Case 1 of 3?`;
      bar.classList.remove('hidden');
    }

    function cancelResetPrompt() {
      state.pendingResetType = null;
      const bar = document.getElementById('resetConfirmBar');
      if (bar) bar.classList.add('hidden');
    }

    function executeConfirmedReset() {
      const type = state.pendingResetType;
      cancelResetPrompt();
      if (type === 'all') {
        const preservedName = state.playerName;
        const preservedMode = state.mode;
        const preservedScale = state.projectorLarge;
        state = createInitialState();
        state.playerName = preservedName;
        state.mode = preservedMode;
        state.projectorLarge = preservedScale;
        saveState();
        showToast('All 6 chapters have been reset.');
        render();
      } else if (type === 'chapter') {
        state.chapters[state.activeChapterNum] = createDefaultChapterState();
        state.view = 'episode';
        saveState();
        showToast(`Chapter ${state.activeChapterNum} reset with a fresh 20T budget.`);
        render();
      }
    }

    function triggerHear() {
      const chProg = getChapterProgress(state.activeChapterNum);
      const cState = chProg.cases[chProg.activeCaseIndex];
      if (cState.heard || cState.confirmed || chProg.wisdom < 5) return;
      chProg.wisdom -= 5;
      cState.heard = true;
      saveState();
      render();
    }

    function triggerSearch() {
      const chProg = getChapterProgress(state.activeChapterNum);
      const cState = chProg.cases[chProg.activeCaseIndex];
      if (cState.searched || cState.confirmed || chProg.wisdom < 5) return;
      chProg.wisdom -= 5;
      cState.searched = true;
      saveState();
      render();
    }

    function selectRuling(key) {
      const ch = getChapter(state.activeChapterNum);
      const chProg = getChapterProgress(state.activeChapterNum);
      const caseDef = ch.cases[chProg.activeCaseIndex];
      const cState = chProg.cases[chProg.activeCaseIndex];
      if (cState.confirmed) return;
      if (key === 'C' && !getActiveRulingC(caseDef, cState)) return;
      cState.selectedKey = cState.selectedKey === key ? null : key;
      saveState();
      render();
    }

    function cancelRuling() {
      const chProg = getChapterProgress(state.activeChapterNum);
      const cState = chProg.cases[chProg.activeCaseIndex];
      cState.selectedKey = null;
      saveState();
      render();
    }

    function confirmRuling() {
      const ch = getChapter(state.activeChapterNum);
      const chProg = getChapterProgress(state.activeChapterNum);
      const caseDef = ch.cases[chProg.activeCaseIndex];
      const cState = chProg.cases[chProg.activeCaseIndex];
      if (!cState.selectedKey || cState.confirmed) return;

      const chosen = getRulingObject(caseDef, cState, cState.selectedKey);
      if (!chosen) return;

      cState.confirmed = true;
      cState.precedent = chosen.precedent;
      cState.scores = { ...chosen.scores };
      cState.rulingCode =
        cState.selectedKey === 'C'
          ? cState.heard && cState.searched
            ? 'C★'
            : 'C'
          : cState.selectedKey;

      saveState();
      render();
    }

    function proceedAfterCase() {
      const chProg = getChapterProgress(state.activeChapterNum);
      if (chProg.activeCaseIndex < 2) {
        chProg.activeCaseIndex += 1;
        state.view = 'episode';
      } else {
        chProg.completed = true;
        state.view = 'autopsy';
      }
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectMirrorOption(idx) {
      const chProg = getChapterProgress(state.activeChapterNum);
      chProg.mirrorChoice = idx;
      saveState();
      render();
    }

    function updateMirrorNote(val) {
      const chProg = getChapterProgress(state.activeChapterNum);
      chProg.mirrorNote = val;
      saveState();
    }

    function togglePrecedentRoll() {
      state.precedentRollOpen = !state.precedentRollOpen;
      render();
    }

    function buildDossierText() {
      const reader = getDisplayName();
      const cumulative = computeCumulativePillarScores();
      const lines = [
        '====================================================================',
        'THE GOOD LIFE: PLATO, ARISTOTLE, AND JESUS IN CONVERSATION',
        'Personal Ethical Autopsy & Introspection Dossier',
        `Participant: ${reader}`,
        'Author: Anand S. Deshbhratar • Author, The Good Life (2026)',
        '====================================================================',
        ''
      ];

      if (cumulative) {
        lines.push(`CUMULATIVE ETHICAL ALIGNMENT (${cumulative.count} Completed Chapter${cumulative.count > 1 ? 's' : ''}):`);
        lines.push(`  JUSTICE: ${cumulative.justice}% | MERCY: ${cumulative.mercy}% | COMMUNITY: ${cumulative.community}%`);
        lines.push('');
      }

      CHAPTERS.forEach((ch) => {
        const prog = state.chapters[ch.num];
        lines.push(`CHAPTER ${ch.num}: ${ch.title.toUpperCase()} (${prog.completed ? 'COMPLETED' : 'IN PROGRESS'})`);
        lines.push(`Wisdom Remaining: ${prog.wisdom}T / 20T`);
        if (prog.completed) {
          const chScores = computeChapterPillarScores(ch, prog);
          lines.push(`Chapter Scorecard: JUSTICE ${chScores.justice}% | MERCY ${chScores.mercy}% | COMMUNITY ${chScores.community}%`);
        }

        prog.cases.forEach((cState, idx) => {
          const caseLabel = idx === 0 ? 'Personal Life' : idx === 1 ? 'Civic/Workplace' : 'Book Encounter';
          if (cState.confirmed) {
            lines.push(
              `  P${idx + 1} [${caseLabel} • Ruling ${cState.rulingCode}]: "${cState.precedent}" (HEAR: ${
                cState.heard ? 'Yes' : 'No'
              }, SEARCH: ${cState.searched ? 'Yes' : 'No'})`
            );
          } else {
            lines.push(`  P${idx + 1} [${caseLabel}]: Not yet ruled.`);
          }
        });

        if (prog.mirrorChoice !== null && ch.mirrorOptions[prog.mirrorChoice]) {
          lines.push(`  Mirror Check (${reader}, ${ch.mirrorPrompt.charAt(0).toLowerCase() + ch.mirrorPrompt.slice(1)}):`);
          lines.push(`    -> ${ch.mirrorOptions[prog.mirrorChoice]}`);
        }
        if (prog.mirrorNote && prog.mirrorNote.trim()) {
          lines.push(`  ${reader}'s Personal Commitment: ${prog.mirrorNote.trim()}`);
        }
        lines.push('');
      });

      lines.push('--------------------------------------------------------------------');
      lines.push(`A FINAL NOTE FROM THE AUTHOR TO ${reader.toUpperCase()}:`);
      lines.push(
        `Thank you for journeying through The Good Life: Plato, Aristotle, and Jesus in Conversation. Philosophical clarity and moral habit matter deeply—yet the heart of Christian ethics is an invitation into the transformational reign of the Kingdom of God, where grace turns admiring the good into living it with humble, self-giving love. To continue this conversation, contact anand.deshbhratar@gmail.com.`
      );

      return lines.join('\n');
    }

    function copyDossierToClipboard() {
      const text = buildDossierText();
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Personal Dossier copied to clipboard!');
      } catch (e) {
        showToast('Unable to copy automatically — please use Download.');
      }
      document.body.removeChild(ta);
    }

    function downloadDossierTxt() {
      const text = buildDossierText();
      const safeName = getDisplayName().toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `the-good-life-${safeName}-dossier.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Downloaded Personal Dossier (.txt)');
    }

    // =========================================================================
    // PERSISTENT STATUS BAR (CLEAN HUD FOCUSED ON CASE PROGRESS & 20T METER)
    // =========================================================================
    function renderGameStatusBar(mode) {
      const chProg = getChapterProgress(state.activeChapterNum);

      let leftBadge = 'CHAPTER HUB';
      let tokenValue = 20;
      const maxTokens = 20;

      if (mode === 'episode') {
        leftBadge = `CASE ${chProg.activeCaseIndex + 1} OF 3`;
        tokenValue = chProg.wisdom;
      } else if (mode === 'autopsy') {
        leftBadge = `CH. ${state.activeChapterNum} AUTOPSY`;
        tokenValue = chProg.wisdom;
      } else if (mode === 'ledger') {
        leftBadge = 'PERSONAL DOSSIER';
        tokenValue = 20;
      }

      const pct = Math.max(0, Math.min(100, (tokenValue / maxTokens) * 100));
      let barColor = 'bg-emerald-400';
      let textColor = 'text-emerald-400';
      if (tokenValue === 0) {
        barColor = 'bg-red-500';
        textColor = 'text-red-500';
      } else if (tokenValue <= 5) {
        barColor = 'bg-amber-400';
        textColor = 'text-amber-400';
      }

      return `
        <div class="pb-4 border-b border-[#26231d]">
          <!-- Row 1: Golden Badge, CHAPTER HUB / RESTART buttons, Lightning + 20T Bar -->
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <div class="flex items-center gap-2">
              <span class="px-3 py-1 rounded-md bg-amber-500 text-obsidian font-mono font-extrabold text-xs tracking-widest uppercase">
                ${leftBadge}
              </span>
              ${
                mode !== 'hub'
                  ? `<button onclick="goToHub()"
                      class="px-2.5 py-1 rounded-md border border-[#26231d] bg-[#15130f] hover:border-amber-500/40 text-[#a89f91] hover:text-[#f5f2eb] font-mono text-xs uppercase tracking-wider transition">
                      CHAPTER HUB
                    </button>`
                  : ''
              }
              ${
                mode === 'episode' || mode === 'autopsy'
                  ? `<button onclick="promptReset('chapter')"
                      class="px-2.5 py-1 rounded-md border border-[#26231d] bg-[#15130f] hover:border-amber-500/40 text-[#a89f91] hover:text-[#f5f2eb] font-mono text-xs uppercase tracking-wider transition">
                      RESTART
                    </button>`
                  : `<button onclick="promptReset('all')"
                      class="px-2.5 py-1 rounded-md border border-[#26231d] bg-[#15130f] hover:border-rose-500/40 text-[#a89f91] hover:text-rose-300 font-mono text-xs uppercase tracking-wider transition">
                      RESET ALL
                    </button>`
              }
            </div>

            <!-- Lightning + 20T Meter -->
            <div class="flex items-center gap-2.5 flex-1 sm:flex-initial justify-end min-w-[165px]">
              <span class="text-amber-400 text-sm" aria-hidden="true">⚡</span>
              <span class="font-mono font-extrabold text-sm ${textColor}">${tokenValue}T</span>
              <div class="w-28 sm:w-36 h-2.5 rounded-full bg-[#211e18] overflow-hidden border border-[#2c271f]">
                <div class="h-full ${barColor} transition-all duration-500 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 1: WELCOME, NAME ENTRY & CHAPTER HUB (READER MODE FIRST)
    // =========================================================================
    function renderHubView() {
      const completedCount = getCompletedChapterCount();
      const progressPct = Math.round((completedCount / CHAPTERS.length) * 100);
      const reader = getDisplayName();

      return `
        <div class="space-y-6 animate-reveal">
          ${renderGameStatusBar('hub')}

          <!-- Welcome & Player Name Card -->

            <div class="relative space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="px-2.5 py-1 rounded-md border border-amber-500/35 bg-amber-500/10 text-amber-400 font-mono text-[11px] font-bold uppercase tracking-widest">

                </span>
                <span class="font-mono text-xs text-emerald-400 font-bold">

                </span>
              </div>

              <div>
                <h1 id="hubWelcomeGreeting" class="text-xl sm:text-2xl font-extrabold text-[#f5f2eb] tracking-tight">
                  ${
                    reader === 'Reader'
                      ? 'Welcome, Reader — Read a Chapter, Then Enter the Dilemma'
                      : `Welcome, ${reader} — Read a Chapter, Then Enter the Dilemma`
                  }
                </h1>
                <p class="font-serif text-sm sm:text-base text-[#cfc6b6] mt-1.5 leading-relaxed">
                  Each chapter offers <strong class="text-[#f5f2eb]">3 focused ethical cases</strong> (Personal Life, Civic/Workplace, and Book Encounter) with <strong class="text-amber-400">20T</strong> out of <strong class="text-[#f5f2eb]">30T</strong> possible investigations, concluding in a personal <strong class="text-emerald-400">Ethical Autopsy</strong>.
                </p>
              </div>

              <!-- Player Name Input -->
              <div class="rounded-xl border border-[#2d281f] bg-[#100e0b] p-3.5 sm:p-4 space-y-2">
                <label for="playerNameInput" class="block font-mono text-[11px] font-bold uppercase tracking-widest text-amber-400">
                  YOUR NAME (FOR PERSONALIZED MIRROR CHECK &amp; AUTHOR NOTE)
                </label>
                <input
                  id="playerNameInput"
                  type="text"
                  value="${(state.playerName || '').replace(/"/g, '&quot;')}"
                  oninput="updatePlayerName(this.value)"

                  class="w-full rounded-lg border border-[#2c271f] bg-[#15130f] focus:border-amber-400 focus:outline-none px-3.5 py-2.5 text-sm text-[#f5f2eb] placeholder-[#6f675b]" />
              </div>

              <!-- Mode Switcher: Reader Mode (Sequential Default) vs Classroom Mode (All 6 Open) -->
              <div class="pt-1 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                <div class="flex items-center gap-1.5 bg-[#100e0b] p-1 rounded-xl border border-[#26231d] self-start">
                  <button onclick="setMode('reader')"
                    class="px-3 py-1.5 rounded-lg font-mono text-[11px] font-bold uppercase tracking-wider transition ${
                      state.mode === 'reader'
                        ? 'bg-amber-500 text-obsidian'
                        : 'text-[#9b9181] hover:text-[#f5f2eb]'
                    }">
                    Reader Mode (Sequential)
                  </button>
                  <button onclick="setMode('classroom')"
                    class="px-3 py-1.5 rounded-lg font-mono text-[11px] font-bold uppercase tracking-wider transition ${
                      state.mode === 'classroom'
                        ? 'bg-emerald-500 text-obsidian'
                        : 'text-[#9b9181] hover:text-[#f5f2eb]'
                    }">
                    Classroom / Advanced (All 6 Open)
                  </button>
                </div>

                <button onclick="goToLedger()"
                  class="font-mono text-xs text-amber-400 hover:text-amber-300 underline underline-offset-4 self-start sm:self-center">
                  View Personal Dossier →
                </button>
              </div>

              <!-- Overall Progress Bar -->
              <div class="w-full h-1.5 rounded-full bg-[#221f18] overflow-hidden">
                <div class="h-full bg-emerald-400 transition-all duration-500 rounded-full" style="width: ${progressPct}%"></div>
              </div>
            </div>
          </section>

          <!-- 6 Chapter Episode Cards -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono uppercase tracking-widest-plus text-[#8f8575]">
                SELECT CHAPTER EPISODE (3 CASES • 20T PER CHAPTER)
              </span>
              <span class="text-[11px] font-mono text-[#7c7467]">
                ${state.mode === 'reader' ? 'Unlocks sequentially' : 'All chapters unlocked'}
              </span>
            </div>

            <div class="grid grid-cols-1 gap-3">
              ${CHAPTERS.map((ch) => {
                const prog = getChapterProgress(ch.num);
                const unlocked = isChapterUnlocked(ch.num);
                const casesCompleted = prog.cases.filter((c) => c.confirmed).length;
                const chScores = prog.completed ? computeChapterPillarScores(ch, prog) : null;

                let statusBadge = '';
                if (prog.completed) {
                  statusBadge = `<span class="px-2.5 py-0.5 rounded-full border border-emerald-500/45 bg-emerald-500/15 font-mono text-[10px] font-bold uppercase tracking-wider text-emerald-400">✓ AUTOPSY READY</span>`;
                } else if (casesCompleted > 0) {
                  statusBadge = `<span class="px-2.5 py-0.5 rounded-full border border-amber-500/45 bg-amber-500/15 font-mono text-[10px] font-bold uppercase tracking-wider text-amber-400">CASE ${prog.activeCaseIndex + 1} OF 3 • ${prog.wisdom}T</span>`;
                } else if (unlocked) {
                  statusBadge = `<span class="px-2.5 py-0.5 rounded-full border border-amber-500/45 bg-amber-500/10 font-mono text-[10px] font-bold uppercase tracking-wider text-amber-300">READY • 20T</span>`;
                } else {
                  statusBadge = `<span class="px-2.5 py-0.5 rounded-full border border-[#2c271f] bg-[#110f0c] font-mono text-[10px] font-bold uppercase tracking-wider text-[#6e6659]">🔒 COMPLETE CH. ${ch.num - 1}</span>`;
                }

                return `
                  <button onclick="openChapter(${ch.num})"
                    ${!unlocked ? 'disabled' : ''}
                    class="w-full text-left rounded-2xl p-4 sm:p-5 border transition-all ${
                      prog.completed
                        ? 'emerald-investigated hover:border-emerald-400/70'
                        : unlocked
                        ? 'card-surface-interactive cursor-pointer'
                        : 'bg-[#110f0c] border-[#1f1c16] opacity-55 cursor-not-allowed'
                    }">
                    <div class="flex items-start justify-between gap-3">
                      <div class="space-y-1.5">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="font-mono text-xs font-extrabold uppercase tracking-wider ${
                            prog.completed ? 'text-emerald-400' : unlocked ? 'text-amber-400' : 'text-[#776f62]'
                          }">
                            CHAPTER ${ch.num}
                          </span>
                          ${statusBadge}
                          ${
                            chScores
                              ? `
                            <span class="px-2 py-0.5 rounded bg-[#101411] border border-[#26332a] font-mono text-[10px] text-[#cfd9d3]">
                              J ${chScores.justice}% • M ${chScores.mercy}% • C ${chScores.community}%
                            </span>
                          `
                              : ''
                          }
                        </div>
                        <h3 class="text-base sm:text-lg font-bold text-[#f5f2eb] leading-snug">
                          ${ch.title}
                        </h3>
                        <p class="text-xs sm:text-sm text-[#a89f90] leading-relaxed">
                          ${ch.subtitle}
                        </p>
                      </div>

                      <div class="shrink-0 mt-1 font-mono text-sm ${
                        prog.completed ? 'text-emerald-400' : unlocked ? 'text-amber-400' : 'text-[#5c5549]'
                      }">
                        ${unlocked ? '→' : '🔒'}
                      </div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 2: ACTIVE CASE (1 OF 3, 2 OF 3, OR 3 OF 3)
    // =========================================================================
    function renderEpisodeView() {
      const ch = getChapter(state.activeChapterNum);
      const chProg = getChapterProgress(state.activeChapterNum);
      const idx = chProg.activeCaseIndex;
      const caseDef = ch.cases[idx];
      const cState = chProg.cases[idx];
      const rulingC = getActiveRulingC(caseDef, cState);
      const bothIntegrated = cState.heard && cState.searched;
      const canAfford = chProg.wisdom >= 5;

      // Prior precedents inscribed in earlier cases of this chapter
      const priorPrecedents = [];
      for (let i = 0; i < idx; i++) {
        if (chProg.cases[i].confirmed && chProg.cases[i].precedent) {
          priorPrecedents.push({
            num: i + 1,
            code: chProg.cases[i].rulingCode,
            text: chProg.cases[i].precedent
          });
        }
      }

      return `
        <div class="space-y-5 animate-reveal">
          ${renderGameStatusBar('episode')}

          <!-- Chapter Progress Stepper (3 Cases) -->
          <div class="grid grid-cols-3 gap-2">
            ${[0, 1, 2]
              .map((stepIdx) => {
                const stepState = chProg.cases[stepIdx];
                const isCurrent = stepIdx === idx;
                const stepLabel = stepIdx === 0 ? '1. Personal' : stepIdx === 1 ? '2. Civic / Work' : '3. Book Text';
                return `
                  <div class="px-2.5 py-2 rounded-xl border text-center font-mono text-[11px] transition ${
                    stepState.confirmed
                      ? 'border-emerald-500/45 bg-emerald-500/10 text-emerald-400 font-bold'
                      : isCurrent
                      ? 'border-amber-500/60 bg-amber-500/10 text-amber-300 font-bold'
                      : 'border-[#221f19] bg-[#12100d] text-[#6f675b]'
                  }">
                    ${stepState.confirmed ? '✓ ' : ''}${stepLabel}
                  </div>
                `;
              })
              .join('')}
          </div>

          ${
            priorPrecedents.length > 0
              ? `
            <div class="rounded-xl border border-amber-500/40 bg-[#17140e] overflow-hidden">
              <button onclick="togglePrecedentRoll()"
                class="w-full px-4 py-2.5 flex items-center justify-between text-left hover:bg-amber-500/[0.04] transition">
                <span class="font-mono text-xs font-bold uppercase tracking-widest text-amber-400">
                  CHAPTER ${ch.num} PRECEDENT ROLL (${priorPrecedents.length})
                </span>
                <span class="font-mono text-amber-400 text-sm">${state.precedentRollOpen ? '−' : '+'}</span>
              </button>
              ${
                state.precedentRollOpen
                  ? `<div class="px-4 pb-3 pt-1 space-y-1.5 border-t border-amber-500/15">
                      ${priorPrecedents
                        .map(
                          (p) => `
                        <div class="text-xs leading-snug">
                          <span class="font-mono font-bold text-amber-400 mr-1.5">P${p.num} (${p.code}):</span>
                          <span class="italic text-[#e5dec9]">“${p.text}”</span>
                        </div>
                      `
                        )
                        .join('')}
                    </div>`
                  : ''
              }
            </div>
          `
              : ''
          }

          <!-- CASE BRIEF CARD -->
          <section class="card-surface rounded-2xl p-5 sm:p-6 space-y-3.5">
            <div class="space-y-2">
              <div class="font-mono text-[11px] font-bold uppercase tracking-widest text-amber-400">
                CHAPTER ${ch.num} • ${caseDef.tag}
              </div>
              <h2 class="text-xl sm:text-2xl font-extrabold text-[#f5f2eb] leading-snug">
                ${caseDef.title}
              </h2>
              <div class="inline-block px-3 py-1 rounded-md border border-amber-500/35 bg-amber-500/[0.07] font-mono text-xs text-amber-300">
                ${caseDef.context}
              </div>
            </div>

            <p class="text-sm sm:text-base text-[#e6dfd2] leading-relaxed">
              ${caseDef.premise}
            </p>
          </section>

          ${
            cState.confirmed
              ? renderCaseOutcome(ch, caseDef, cState, idx)
              : `
            <!-- INVESTIGATION SECTION (20T ACROSS 3 CASES = 30T MAX) -->
            <section class="space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-[11px] font-mono uppercase tracking-widest-plus text-[#8d8373]">
                  INVESTIGATE — 5T PER ACTION (${chProg.wisdom}T LEFT FOR ${3 - idx} CASE${3 - idx > 1 ? 'S' : ''})
                </span>
                ${
                  chProg.wisdom === 0
                    ? `<span class="text-[11px] font-mono font-bold text-rose-400">0T REMAINING — RULE WITH WHAT YOU KNOW</span>`
                    : ''
                }
              </div>

              <div class="grid grid-cols-2 gap-3">
                <!-- HEAR BUTTON -->
                <div>
                  <button onclick="triggerHear()"
                    ${cState.heard || !canAfford ? 'disabled' : ''}
                    class="w-full text-left p-4 rounded-xl border transition-all ${
                      cState.heard
                        ? 'emerald-investigated cursor-default'
                        : canAfford
                        ? 'card-surface-interactive cursor-pointer'
                        : 'bg-[#12100d] border-[#221f19] opacity-50 cursor-not-allowed'
                    }">
                    <div class="mb-2 ${cState.heard ? 'text-emerald-400' : 'text-amber-400'}">
                      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0" />
                        <path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4" />
                      </svg>
                    </div>
                    <div class="font-mono font-bold text-xs sm:text-sm tracking-wider uppercase ${
                      cState.heard ? 'text-emerald-400' : 'text-[#f3efe6]'
                    }">
                      ${cState.heard ? '✓ HEARD' : 'HEAR (5T)'}
                    </div>
                  </button>
                  ${
                    !cState.heard && cState.searched && canAfford
                      ? `<p class="mt-1.5 text-[11px] italic text-[#9b9181] leading-snug">+5T to combine facts &amp; principle (upgrades Ruling C)</p>`
                      : ''
                  }
                </div>

                <!-- SEARCH BUTTON -->
                <div>
                  <button onclick="triggerSearch()"
                    ${cState.searched || !canAfford ? 'disabled' : ''}
                    class="w-full text-left p-4 rounded-xl border transition-all ${
                      cState.searched
                        ? 'emerald-investigated cursor-default'
                        : canAfford
                        ? 'card-surface-interactive cursor-pointer'
                        : 'bg-[#12100d] border-[#221f19] opacity-50 cursor-not-allowed'
                    }">
                    <div class="mb-2 ${cState.searched ? 'text-emerald-400' : 'text-amber-400'}">
                      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                      </svg>
                    </div>
                    <div class="font-mono font-bold text-xs sm:text-sm tracking-wider uppercase ${
                      cState.searched ? 'text-emerald-400' : 'text-[#f3efe6]'
                    }">
                      ${cState.searched ? '✓ SEARCHED' : 'SEARCH (5T)'}
                    </div>
                  </button>
                  ${
                    cState.heard && !cState.searched && canAfford
                      ? `<p class="mt-1.5 text-[11px] italic text-[#9b9181] leading-snug">+5T to combine facts &amp; principle (upgrades Ruling C)</p>`
                      : ''
                  }
                </div>
              </div>

              <!-- REVEALED CLUES -->
              ${
                cState.heard
                  ? `
                <div class="rounded-xl border border-[#2d281f] border-l-4 border-l-amber-500 bg-[#17140f] p-4 space-y-1.5 animate-reveal">
                  <div class="font-mono text-[11px] font-bold uppercase tracking-widest text-amber-400">
                    HEARD — HIDDEN HUMAN REALITY
                  </div>
                  <p class="text-sm sm:text-base text-[#f0eae0] leading-relaxed">
                    ${caseDef.hearClue}
                  </p>
                </div>
              `
                  : ''
              }

              ${
                cState.searched
                  ? `
                <div class="rounded-xl border border-[#22332a] border-l-4 border-l-emerald-400 bg-[#121915] p-4 space-y-1.5 animate-reveal">
                  <div class="font-mono text-[11px] font-bold uppercase tracking-widest text-emerald-400">
                    ${idx === 2 ? 'SEARCHED — PLATO, ARISTOTLE & SCRIPTURE' : 'SEARCHED — ETHICAL PRINCIPLE'}
                  </div>
                  <p class="text-sm sm:text-base text-[#f0eae0] leading-relaxed">
                    ${caseDef.searchClue}
                  </p>
                </div>
              `
                  : ''
              }
            </section>

            <!-- RULINGS SECTION -->
            <section class="space-y-3">
              <div class="text-[11px] font-mono uppercase tracking-widest-plus text-[#8d8373]">
                RULE — SET A PRECEDENT
              </div>

              ${['A', 'B'].map((key) => renderRulingCard(key, caseDef.rulings[key], cState, false)).join('')}

              ${
                rulingC
                  ? renderRulingCard('C', rulingC, cState, bothIntegrated)
                  : `
                <div class="rounded-xl border border-[#232019] bg-[#13110d] p-4 flex items-center gap-3.5 text-[#7a7163]">
                  <svg class="w-4 h-4 text-amber-500/60 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                  <p class="text-xs sm:text-sm leading-relaxed">
                    <span class="font-mono uppercase tracking-wider text-[#8e8474]">UNEXAMINED RULING</span> — Spend 5T on HEAR or SEARCH to unlock a deeper synthesis ruling.
                  </p>
                </div>
              `
              }
            </section>
          `
          }
        </div>
      `;
    }

    function renderRulingCard(key, rulingObj, cState, isIntegrated) {
      const isSelected = cState.selectedKey === key;
      return `
        <div onclick="selectRuling('${key}')"
          class="rounded-2xl p-5 cursor-pointer transition-all ${
            isSelected ? 'ruling-selected' : 'card-surface-interactive'
          }">
          <div class="space-y-3">
            <div class="w-7 h-7 rounded-md border border-[#363026] bg-[#1f1c16] flex items-center justify-center font-mono font-bold text-xs text-[#f3efe6]">
              ${key}
            </div>

            <div class="space-y-1.5">
              <h3 class="text-base sm:text-lg font-bold text-[#f7f3eb] leading-snug">
                ${rulingObj.title}
              </h3>
              <p class="text-xs sm:text-sm text-[#cfc6b6] leading-relaxed">
                ${rulingObj.desc}
              </p>
            </div>

            <p class="text-xs sm:text-sm italic text-amber-400/95">
              Precedent: “${rulingObj.precedent}”
            </p>

            ${
              isIntegrated
                ? `
              <div class="pt-0.5">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-md border border-emerald-500/45 bg-emerald-500/10 font-mono text-[11px] font-bold uppercase tracking-wider text-emerald-400">
                  <span>✓ FACTS + PRINCIPLE INTEGRATED</span>
                </span>
              </div>
            `
                : ''
            }

            ${
              isSelected
                ? `
              <div class="pt-3 mt-3 border-t border-dashed border-[#383126] space-y-3 animate-reveal" onclick="event.stopPropagation()">
                <div class="text-sm font-bold text-[#f5f0e6]">Confirm this ruling?</div>
                <div class="flex flex-col gap-2">
                  <button onclick="confirmRuling()"
                    class="w-full py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-obsidian font-mono font-extrabold text-xs sm:text-sm uppercase tracking-widest-plus transition shadow-md shadow-amber-500/20">
                    CONFIRM
                  </button>
                  <button onclick="cancelRuling()"
                    class="w-full py-3 px-4 rounded-xl border border-[#2f2a20] bg-[#14120e] hover:bg-[#1c1914] text-[#9b9180] hover:text-[#f3efe6] font-mono text-xs uppercase tracking-widest-plus transition">
                    CANCEL
                  </button>
                </div>
              </div>
            `
                : ''
            }
          </div>
        </div>
      `;
    }

    function renderCaseOutcome(ch, caseDef, cState, idx) {
      const chosen = getRulingObject(caseDef, cState, cState.selectedKey);
      const isThirdCase = idx === 2;

      return `
        <section class="card-surface rounded-2xl p-5 sm:p-6 space-y-4 animate-reveal">
          <div class="flex items-center justify-between">
            <span class="font-mono text-xs font-bold uppercase tracking-widest-plus text-amber-400">
              ${isThirdCase ? 'THE CITY REACTS' : 'CONSEQUENCE AT THE GATE'}
            </span>
            <span class="px-2.5 py-0.5 rounded bg-amber-500/15 border border-amber-500/35 font-mono text-[11px] font-bold text-amber-300">
              RULING ${cState.rulingCode}
            </span>
          </div>

          <p class="text-sm sm:text-base text-[#f2ece1] leading-relaxed">
            ${chosen.reaction}
          </p>

          ${
            chosen.voices
              ? `
            <div class="rounded-xl border border-[#2d281f] bg-[#110f0c] p-4 space-y-2">
              <div class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400">
                THREE VOICES IN CONVERSATION
              </div>
              <p class="font-serif italic text-xs sm:text-sm text-[#e6dfd2] leading-relaxed">${chosen.voices.plato}</p>
              <p class="font-serif italic text-xs sm:text-sm text-[#e6dfd2] leading-relaxed">${chosen.voices.aristotle}</p>
              <p class="font-serif italic text-xs sm:text-sm text-[#f5f2eb] leading-relaxed">${chosen.voices.jesus}</p>
            </div>
          `
              : chosen.reflection
              ? `
            <div class="rounded-xl border border-[#2d281f] bg-[#110f0c] p-3.5 text-xs sm:text-sm text-[#d9d0c1] leading-relaxed">
              <span class="font-mono text-[10px] font-bold uppercase tracking-widest text-emerald-400 block mb-1">ETHICAL INSIGHT</span>
              ${chosen.reflection}
            </div>
          `
              : ''
          }

          <p class="text-xs sm:text-sm italic text-amber-400/95">
            Precedent P${idx + 1} inscribed: “${chosen.precedent}”
          </p>

          <button onclick="proceedAfterCase()"
            class="w-full py-4 px-5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-obsidian font-mono font-extrabold text-xs sm:text-sm uppercase tracking-widest-plus transition shadow-lg shadow-amber-500/20">
            ${
              idx === 0
                ? 'NEXT: CASE 2 OF 3 (CIVIC & WORKPLACE) →'
                : idx === 1
                ? 'NEXT: CASE 3 OF 3 (THE BOOK ENCOUNTER) →'
                : `COMPLETE CHAPTER ${ch.num} & VIEW ETHICAL AUTOPSY →`
            }
          </button>
        </section>
      `;
    }

    // =========================================================================
    // VIEW 3: END-OF-CHAPTER ETHICAL AUTOPSY, PERSONALIZED MIRROR & AUTHOR NOTE
    // =========================================================================
    function renderAutopsyView() {
      const ch = getChapter(state.activeChapterNum);
      const chProg = getChapterProgress(state.activeChapterNum);
      const reader = getDisplayName();
      const hasNextChapter = ch.num < CHAPTERS.length;

      // Diagnose player's investigation & ruling pattern in this chapter
      const hearCount = chProg.cases.filter((c) => c.heard).length;
      const searchCount = chProg.cases.filter((c) => c.searched).length;
      const integratedCount = chProg.cases.filter((c) => c.heard && c.searched).length;
      const unexaminedCount = chProg.cases.filter((c) => !c.heard && !c.searched).length;
      const spentTokens = 20 - chProg.wisdom;
      const pillarScores = computeChapterPillarScores(ch, chProg);
      const pillarDiagnostic = getPillarDiagnostic(pillarScores);

      let autopsyTitle = 'Balanced Discernment Under Scarcity';
      let autopsyDiagnosis = `You invested ${spentTokens}T of your 20T budget (${hearCount} HEAR, ${searchCount} SEARCH), balancing human empathy with moral principle.`;
      if (integratedCount >= 2) {
        autopsyTitle = 'Deep Synthesizer (Facts + Principle Integrated)';
        autopsyDiagnosis = `You concentrated your 20T budget to achieve ${integratedCount} full integrations (HEAR + SEARCH), leaving ${
          unexaminedCount > 0 ? `${unexaminedCount} case uninvestigated—testing how you rule when tokens run dry.` : 'no stone unturned.'
        }`;
      } else if (hearCount > searchCount) {
        autopsyTitle = 'Human-First Listener (Empathy-Weighted)';
        autopsyDiagnosis = `You prioritized HEAR (${hearCount}×) over SEARCH (${searchCount}×), tuning closely to hidden human pain while occasionally risking principle blind spots.`;
      } else if (searchCount > hearCount) {
        autopsyTitle = 'Principle-First Jurist (Concept-Weighted)';
        autopsyDiagnosis = `You prioritized SEARCH (${searchCount}×) over HEAR (${hearCount}×), anchoring rulings in ethical clarity while leaving some hidden human motives unprobed.`;
      } else if (spentTokens === 0) {
        autopsyTitle = 'Unexamined Intuition (20T Unspent)';
        autopsyDiagnosis =
          'You ruled across all three cases without spending a single token on HEAR or SEARCH—relying purely on immediate instinct rather than deeper inquiry.';
      }

      return `
        <div class="space-y-5 animate-reveal">
          ${renderGameStatusBar('autopsy')}

          <!-- 1. CHAPTER ETHICAL AUTOPSY CARD -->
          <section class="card-surface rounded-2xl p-5 sm:p-6 space-y-5 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-amber-500/[0.06] via-transparent to-emerald-500/[0.05] pointer-events-none"></div>
            <div class="relative space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="px-3 py-1 rounded-full border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 font-mono text-[11px] font-bold uppercase tracking-widest">
                  ✓ CHAPTER ${ch.num} ETHICAL AUTOPSY
                </span>
                <span class="font-mono text-xs text-[#9b9181]">
                  SPENT ${spentTokens}T / 20T
                </span>
              </div>

              <div>
                <div class="font-mono text-[11px] uppercase tracking-widest text-amber-400">
                  ${reader}’s Moral Posture in Chapter ${ch.num}
                </div>
                <h2 class="text-xl sm:text-2xl font-extrabold text-[#f5f2eb] mt-1">
                  ${autopsyTitle}
                </h2>
                <p class="text-xs sm:text-sm text-[#d6cec0] mt-2 leading-relaxed">
                  ${autopsyDiagnosis}
                </p>
              </div>

              <!-- 3-PARAMETER CHAPTER SCORECARD: JUSTICE • MERCY • COMMUNITY -->
              <div class="rounded-xl border border-[#2d281f] bg-[#100e0b] p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400">
                    CHAPTER ${ch.num} ETHICAL ALIGNMENT SCORECARD
                  </span>
                  <span class="font-mono text-[10px] text-[#8f877a]">Based on Your 3 Rulings</span>
                </div>

                <div class="grid grid-cols-3 gap-2.5">
                  <div class="rounded-lg border border-amber-500/35 bg-[#15120d] p-2.5 text-center space-y-1.5">
                    <div class="font-mono text-[10px] font-bold tracking-widest text-amber-400">JUSTICE</div>
                    <div class="font-mono text-lg sm:text-xl font-extrabold text-[#f5f2eb]">${pillarScores.justice}%</div>
                    <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                      <div class="h-full bg-amber-400 rounded-full transition-all duration-500" style="width: ${pillarScores.justice}%"></div>
                    </div>
                  </div>

                  <div class="rounded-lg border border-emerald-500/35 bg-[#101713] p-2.5 text-center space-y-1.5">
                    <div class="font-mono text-[10px] font-bold tracking-widest text-emerald-400">MERCY</div>
                    <div class="font-mono text-lg sm:text-xl font-extrabold text-[#f5f2eb]">${pillarScores.mercy}%</div>
                    <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                      <div class="h-full bg-emerald-400 rounded-full transition-all duration-500" style="width: ${pillarScores.mercy}%"></div>
                    </div>
                  </div>

                  <div class="rounded-lg border border-sky-500/35 bg-[#101519] p-2.5 text-center space-y-1.5">
                    <div class="font-mono text-[10px] font-bold tracking-widest text-sky-400">COMMUNITY</div>
                    <div class="font-mono text-lg sm:text-xl font-extrabold text-[#f5f2eb]">${pillarScores.community}%</div>
                    <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                      <div class="h-full bg-sky-400 rounded-full transition-all duration-500" style="width: ${pillarScores.community}%"></div>
                    </div>
                  </div>
                </div>

                <p class="text-xs text-[#cfc6b6] leading-relaxed pt-1 border-t border-[#221e17]">
                  ${pillarDiagnostic}
                </p>
              </div>

              <!-- 3 Inscribed Precedents Summary -->
              <div class="space-y-2 pt-1">
                <div class="font-mono text-[10px] font-bold uppercase tracking-widest text-[#8f8575]">
                  YOUR 3 INSCRIBED PRECEDENTS IN CHAPTER ${ch.num}
                </div>
                ${chProg.cases
                  .map((cState, idx) => {
                    const label = idx === 0 ? 'Personal Life' : idx === 1 ? 'Civic / Workplace' : 'Book Encounter';
                    const badge =
                      cState.heard && cState.searched
                        ? 'HEAR + SEARCH'
                        : cState.heard
                        ? 'HEAR ONLY'
                        : cState.searched
                        ? 'SEARCH ONLY'
                        : 'UNEXAMINED';
                    return `
                      <div class="rounded-xl border border-[#26231d] bg-[#110f0c] p-3 text-xs space-y-1">
                        <div class="flex items-center justify-between font-mono text-[10px]">
                          <span class="text-amber-400 font-bold">P${idx + 1} • ${label} (Ruling ${cState.rulingCode})</span>
                          <span class="text-[#8f8575]">${badge}</span>
                        </div>
                        <p class="font-serif italic text-xs sm:text-sm text-[#f2ece1]">“${cState.precedent}”</p>
                      </div>
                    `;
                  })
                  .join('')}
              </div>

              <div class="rounded-xl border border-[#29241c] bg-[#12100c] p-3.5 text-xs sm:text-sm text-[#cfc6b6] leading-relaxed">
                <span class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400 block mb-1">
                  CHAPTER CORE TAKEAWAY
                </span>
                ${ch.autopsyReflection}
              </div>
            </div>
          </section>

          <!-- 2. MIRROR CHECK ADDRESSED TO [PLAYER NAME] -->
          <section class="rounded-2xl border border-emerald-500/40 bg-[#111713] p-5 sm:p-6 space-y-3.5">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono text-xs font-bold uppercase tracking-widest-plus text-emerald-400">
                MIRROR CHECK
              </span>
              <span class="text-[10px] font-mono text-emerald-300/75">Auto-saved</span>
            </div>

            <p class="font-serif italic text-sm sm:text-base text-[#f5f2eb] leading-relaxed">
              “${reader}, ${ch.mirrorPrompt.charAt(0).toLowerCase() + ch.mirrorPrompt.slice(1)}”
            </p>

            <div class="space-y-2">
              ${ch.mirrorOptions
                .map((opt, idx) => {
                  const selected = chProg.mirrorChoice === idx;
                  return `
                    <button onclick="selectMirrorOption(${idx})"
                      class="w-full text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition flex items-center gap-3 ${
                        selected
                          ? 'border-emerald-400 bg-emerald-500/15 text-[#f5f2eb] font-medium'
                          : 'border-[#24322a] bg-[#0d130f] hover:border-emerald-500/40 text-[#c9d5ce]'
                      }">
                      <span class="w-4 h-4 rounded-full border flex items-center justify-center shrink-0 text-[10px] font-bold ${
                        selected ? 'border-emerald-400 bg-emerald-400 text-obsidian' : 'border-[#455c4f]'
                      }">
                        ${selected ? '✓' : ''}
                      </span>
                      <span>${opt}</span>
                    </button>
                  `;
                })
                .join('')}
            </div>

            <div class="pt-1">
              <label for="mirrorInput_${ch.num}" class="sr-only">Personal note for ${reader}</label>
              <input
                id="mirrorInput_${ch.num}"
                type="text"
                value="${(chProg.mirrorNote || '').replace(/"/g, '&quot;')}"
                oninput="updateMirrorNote(this.value)"
                placeholder="${reader}, write a 1-sentence personal commitment or takeaway here..."
                class="w-full rounded-xl border border-[#24322a] bg-[#0c110e] focus:border-emerald-400 focus:outline-none px-3.5 py-2.5 text-xs sm:text-sm text-[#f5f2eb] placeholder-[#68786f]" />
            </div>
          </section>

          <!-- 3. PERSONAL THANK-YOU NOTE FROM THE AUTHOR -->
          <section class="rounded-2xl border border-[#2f2a20] bg-[#14120e] p-5 sm:p-6 space-y-2.5">
            <div class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400">
              A PERSONAL NOTE FROM THE AUTHOR
            </div>
            <p class="font-serif italic text-sm sm:text-base text-[#ebe5d8] leading-relaxed">
              “${ch.authorNote ? ch.authorNote.replace(/\{reader\}/g, reader) : `Dear ${reader}, thank you for walking thoughtfully through Chapter ${ch.num} and allowing these ethical questions to examine your own habits, loves, and responsibilities. Keep reading and testing your discernment in the next chapter!`}”
            </p>
            <div class="pt-1 text-xs">
              <span class="font-bold text-[#f5f2eb]">Anand S. Deshbhratar</span>
              <span class="text-[#9c9282]"> • Author, The Good Life (2026)</span>
            </div>
          </section>

          <!-- 4. NEXT CHAPTER CLIFFHANGER HOOK & RESET 20T PROGRESSION -->
          <section class="rounded-2xl border border-amber-500/45 bg-gradient-to-br from-[#1b160f] to-[#12100c] p-5 sm:p-6 space-y-4">
            <div class="space-y-2">
              <div class="font-mono text-[11px] font-bold uppercase tracking-widest text-amber-400">
                ✦ ${ch.cliffhangerTitle}
              </div>
              <p class="font-serif italic text-sm sm:text-base text-[#f5f2eb] leading-relaxed">
                ${ch.cliffhangerText}
              </p>
            </div>

            ${
              hasNextChapter
                ? `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button onclick="openChapter(${ch.num + 1})"
                  class="py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-obsidian font-mono font-extrabold text-xs uppercase tracking-widest-plus transition shadow-lg shadow-amber-500/20">
                  PROCEED TO CHAPTER ${ch.num + 1} (RESET 20T) →
                </button>
                <button onclick="goToHub()"
                  class="py-3.5 px-4 rounded-xl border border-[#26231d] bg-[#15130f] hover:border-amber-500/40 text-[#d5cec2] font-mono font-bold text-xs uppercase tracking-widest-plus transition">
                  RETURN TO CHAPTER HUB
                </button>
              </div>
            `
                : `
              <button onclick="goToLedger()"
                class="w-full py-4 px-5 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-obsidian font-mono font-extrabold text-xs sm:text-sm uppercase tracking-widest-plus transition shadow-lg shadow-emerald-500/20">
                COMPLETE BOOK JOURNEY &amp; OPEN PERSONAL DOSSIER →
              </button>
            `
            }
          </section>
        </div>
      `;
    }

    // =========================================================================
    // VIEW 4: COMPLETE PERSONAL DOSSIER & AUTHOR THANK YOU
    // =========================================================================
    function renderLedgerView() {
      const completedCount = getCompletedChapterCount();
      const reader = getDisplayName();
      const cumulative = computeCumulativePillarScores();

      return `
        <div class="space-y-6 animate-reveal">
          ${renderGameStatusBar('ledger')}

          <!-- Epilogue & Author Gratitude Card -->
          <section class="card-surface rounded-2xl p-6 space-y-4 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/[0.06] via-transparent to-amber-500/[0.06] pointer-events-none"></div>
            <div class="relative space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="px-3 py-1 rounded-full border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 font-mono text-[11px] font-bold uppercase tracking-widest">
                  EPILOGUE • ${completedCount} OF 6 CHAPTERS COMPLETED
                </span>
                <button onclick="goToHub()" class="font-mono text-xs text-amber-400 hover:underline">
                  ← Chapter Hub
                </button>
              </div>

              <h2 class="text-2xl sm:text-3xl font-extrabold text-[#f5f2eb]">
                ${reader}’s Journey Beneath the Monument
              </h2>

              ${
                cumulative
                  ? `
                <div class="rounded-xl border border-[#2d281f] bg-[#100e0b] p-4 space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400">
                      CUMULATIVE ETHICAL ALIGNMENT (${cumulative.count} CHAPTER${cumulative.count > 1 ? 'S' : ''})
                    </span>
                    <span class="font-mono text-[10px] text-[#8f877a]">Average Across Completed Chapters</span>
                  </div>
                  <div class="grid grid-cols-3 gap-2.5">
                    <div class="rounded-lg border border-amber-500/35 bg-[#15120d] p-2.5 text-center space-y-1">
                      <div class="font-mono text-[10px] font-bold tracking-widest text-amber-400">JUSTICE</div>
                      <div class="font-mono text-lg font-extrabold text-[#f5f2eb]">${cumulative.justice}%</div>
                      <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                        <div class="h-full bg-amber-400 rounded-full" style="width: ${cumulative.justice}%"></div>
                      </div>
                    </div>
                    <div class="rounded-lg border border-emerald-500/35 bg-[#101713] p-2.5 text-center space-y-1">
                      <div class="font-mono text-[10px] font-bold tracking-widest text-emerald-400">MERCY</div>
                      <div class="font-mono text-lg font-extrabold text-[#f5f2eb]">${cumulative.mercy}%</div>
                      <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                        <div class="h-full bg-emerald-400 rounded-full" style="width: ${cumulative.mercy}%"></div>
                      </div>
                    </div>
                    <div class="rounded-lg border border-sky-500/35 bg-[#101519] p-2.5 text-center space-y-1">
                      <div class="font-mono text-[10px] font-bold tracking-widest text-sky-400">COMMUNITY</div>
                      <div class="font-mono text-lg font-extrabold text-[#f5f2eb]">${cumulative.community}%</div>
                      <div class="w-full h-1.5 rounded-full bg-[#242019] overflow-hidden">
                        <div class="h-full bg-sky-400 rounded-full" style="width: ${cumulative.community}%"></div>
                      </div>
                    </div>
                  </div>
                </div>
              `
                  : ''
              }

              <p class="font-serif italic text-sm sm:text-base text-[#e4ddd0] leading-relaxed">
                “Beneath the monument, someone had seen a stranger. The good had become visible again—not as a word carved into stone, nor as an ideal safely admired from a distance, but as a life interrupted by the need of another.”
              </p>

              <!-- Signed Thank-You Message from the Author -->
              <div class="rounded-xl border border-amber-500/35 bg-[#110f0c] p-4 sm:p-5 space-y-2.5">
                <div class="font-mono text-[10px] font-bold uppercase tracking-widest text-amber-400">
                  A FINAL INVITATION INTO TRANSFORMATIONAL KINGDOM ETHICS
                </div>
                <p class="font-serif text-sm sm:text-base text-[#f5f2eb] leading-relaxed">
                  “Dear <strong>${reader}</strong>, thank you for journeying through <em>The Good Life: Plato, Aristotle, and Jesus in Conversation</em>. Philosophical clarity and moral habit matter deeply—yet the heart of Christian ethics is an invitation into the transformational reign of the Kingdom of God, where grace turns admiring the good into living it with humble, self-giving love. If you would like to continue this conversation, write to me at <a href="mailto:anand.deshbhratar@gmail.com" class="font-mono text-xs sm:text-sm text-amber-400 underline hover:text-amber-300">anand.deshbhratar@gmail.com</a>.”
                </p>
                <div class="pt-1 text-xs text-[#a89f91]">
                  — <strong class="text-[#f5f2eb]">Anand S. Deshbhratar</strong> • Author, The Good Life (2026)
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                <button onclick="copyDossierToClipboard()"
                  class="py-3.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-obsidian font-mono font-extrabold text-xs uppercase tracking-widest-plus transition">
                  COPY DOSSIER TO CLIPBOARD
                </button>
                <button onclick="downloadDossierTxt()"
                  class="py-3.5 px-4 rounded-xl border border-emerald-500/45 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 font-mono font-bold text-xs uppercase tracking-widest-plus transition">
                  DOWNLOAD DOSSIER (.TXT)
                </button>
              </div>
            </div>
          </section>

          <!-- Chapter-by-Chapter Summary -->
          <section class="space-y-3">
            ${CHAPTERS.map((ch) => {
              const prog = state.chapters[ch.num];
              const hasAny = prog && prog.cases.some((c) => c.confirmed);
              const chScores = prog && prog.completed ? computeChapterPillarScores(ch, prog) : null;
              return `
                <div class="card-surface rounded-2xl p-4 sm:p-5 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="font-mono text-xs font-bold uppercase tracking-wider ${
                        prog?.completed ? 'text-emerald-400' : 'text-amber-400'
                      }">
                        CHAPTER ${ch.num} • ${ch.title}
                      </span>
                      ${
                        chScores
                          ? `
                        <span class="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/30 font-mono text-[10px] font-bold text-amber-400">
                          J ${chScores.justice}%
                        </span>
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/30 font-mono text-[10px] font-bold text-emerald-400">
                          M ${chScores.mercy}%
                        </span>
                        <span class="px-2 py-0.5 rounded bg-sky-500/10 border border-sky-500/30 font-mono text-[10px] font-bold text-sky-400">
                          C ${chScores.community}%
                        </span>
                      `
                          : ''
                      }
                    </div>
                    <button onclick="openChapter(${ch.num})" class="font-mono text-[11px] text-amber-400 hover:underline">
                      ${prog?.completed ? 'View Ethical Autopsy →' : 'Play Chapter →'}
                    </button>
                  </div>

                  ${
                    hasAny
                      ? `
                    <div class="space-y-2">
                      ${prog.cases
                        .map((c, idx) => {
                          if (!c.confirmed) return '';
                          const label = idx === 0 ? 'Personal' : idx === 1 ? 'Civic / Work' : 'Book Text';
                          return `
                            <div class="rounded-xl border border-[#26231d] bg-[#110f0c] p-3 text-xs space-y-1">
                              <div class="font-mono text-[10px] text-amber-400 font-bold">
                                P${idx + 1} (${label} • Ruling ${c.rulingCode})
                              </div>
                              <div class="font-serif italic text-xs sm:text-sm text-[#f5f2eb]">“${c.precedent}”</div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                    ${
                      prog.mirrorChoice !== null || (prog.mirrorNote && prog.mirrorNote.trim())
                        ? `
                      <div class="rounded-xl border border-emerald-500/25 bg-[#0f1512] p-3 text-xs space-y-1">
                        <div class="font-mono text-[10px] font-bold uppercase tracking-wider text-emerald-400">
                          MIRROR CHECK
                        </div>
                        ${
                          prog.mirrorChoice !== null && ch.mirrorOptions[prog.mirrorChoice]
                            ? `<p class="text-[#d4dfd9]">• ${ch.mirrorOptions[prog.mirrorChoice]}</p>`
                            : ''
                        }
                        ${
                          prog.mirrorNote && prog.mirrorNote.trim()
                            ? `<p class="font-serif italic text-[#f5f2eb]">“${prog.mirrorNote.trim()}”</p>`
                            : ''
                        }
                      </div>
                    `
                        : ''
                    }
                  `
                      : `<p class="text-xs text-[#7c7467]">Not yet played.</p>`
                  }
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // MASTER RENDER
    // =========================================================================
    function render() {
      const app = document.getElementById('appContainer');
      const label = document.getElementById('projectorLabel');
      if (state.projectorLarge) {
        app.classList.remove('max-w-2xl');
        app.classList.add('max-w-3xl', 'text-lg');
        if (label) label.textContent = 'Large';
      } else {
        app.classList.remove('max-w-3xl', 'text-lg');
        app.classList.add('max-w-2xl');
        if (label) label.textContent = 'Standard';
      }

      if (state.view === 'hub') {
        app.innerHTML = renderHubView();
      } else if (state.view === 'episode') {
        app.innerHTML = renderEpisodeView();
      } else if (state.view === 'autopsy') {
        app.innerHTML = renderAutopsyView();
      } else if (state.view === 'ledger') {
        app.innerHTML = renderLedgerView();
      }
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
